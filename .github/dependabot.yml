version: 2
updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    ignore:
      # Pinned to the oldest Roslyn with the APIs of the source generator, which then loads in older Visual Studio and
      # .NET SDK versions: see the comment of its version in Directory.Packages.props
      - dependency-name: "Microsoft.CodeAnalysis.CSharp"
    groups:
      nuget:
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns:
          - "*"
